<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AgriMarket — Sign Up</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        :root {
            --cream:       #faf7f2;
            --beige:       #f0ebe0;
            --green-dark:  #1a3d2b;
            --green-mid:   #2d6a4f;
            --green-light: #52b788;
            --gold:        #c9a84c;
            --gold-light:  #f0d080;
            --text-main:   #1c2b22;
            --text-muted:  #6b7f6e;
            --white:       #ffffff;
            --radius-lg:   20px;
            --radius-md:   12px;
            --radius-sm:   8px;
            --transition:  all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--green-dark);
            overflow-x: hidden;
            padding: 32px 20px;
        }

        /* ─── BACKGROUND ────────────────────────────────── */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 60% at 85% 10%,  rgba(82,183,136,0.16) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 10% 90%,  rgba(201,168,76,0.11) 0%, transparent 60%),
                linear-gradient(160deg, #0d2017 0%, #1a3d2b 50%, #0f2419 100%);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: drift linear infinite;
            opacity: 0.06;
        }

        .orb1 { width: 320px; height: 320px; background: var(--green-light); top: -80px;  right: -60px; animation-duration: 20s; }
        .orb2 { width: 200px; height: 200px; background: var(--gold);        bottom: -40px; left: -40px; animation-duration: 24s; animation-delay: -10s; }
        .orb3 { width: 140px; height: 140px; background: var(--green-light); top: 40%;    right: 8%;   animation-duration: 17s; animation-delay: -5s; }

        @keyframes drift {
            0%   { transform: translate(0,0) scale(1); }
            33%  { transform: translate(-25px, 18px) scale(1.04); }
            66%  { transform: translate(18px, -12px) scale(0.97); }
            100% { transform: translate(0,0) scale(1); }
        }

        /* ─── CARD ──────────────────────────────────────── */
        .signup-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 44px 44px 40px;
            box-shadow:
                0 32px 80px rgba(0,0,0,0.4),
                0 0 0 1px rgba(82,183,136,0.08) inset;
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ─── LOGO ──────────────────────────────────────── */
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 28px;
        }

        .logo-icon {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, var(--green-light), var(--gold));
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--white);
            box-shadow: 0 4px 18px rgba(82,183,136,0.4);
            flex-shrink: 0;
        }

        .logo-name {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--white);
            line-height: 1;
        }

        .logo-name span { color: var(--gold-light); }

        .logo-tagline {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* ─── HEADING ───────────────────────────────────── */
        .welcome-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 6px;
        }

        .welcome-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* ─── ROLE TOGGLE ───────────────────────────────── */
        .role-label-text {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 10px;
        }

        .role-toggle {
            display: flex;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 4px;
            margin-bottom: 26px;
            gap: 4px;
        }

        /* Hidden native select preserved for JS */
        #role { display: none; }

        .role-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 50px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            color: rgba(255,255,255,0.45);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .role-btn.active {
            background: linear-gradient(135deg, var(--green-light), var(--green-mid));
            color: var(--white);
            box-shadow: 0 4px 14px rgba(45,106,79,0.4);
            font-weight: 600;
        }

        .role-btn:not(.active):hover {
            color: rgba(255,255,255,0.75);
            background: rgba(255,255,255,0.06);
        }

        /* ─── FORM ──────────────────────────────────────── */
        .form-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.28);
            font-size: 13px;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-wrap input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: rgba(255,255,255,0.07);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--white);
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .input-wrap input::placeholder { color: rgba(255,255,255,0.22); }

        .input-wrap input:focus {
            border-color: var(--green-light);
            background: rgba(82,183,136,0.08);
            box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
        }

        .input-wrap:focus-within .input-icon { color: var(--green-light); }

        /* ─── LOCATION FIELD (farmer only) ──────────────── */
        .location-group {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin 0.3s ease;
            margin-top: 0;
        }

        .location-group.visible {
            max-height: 120px;
            opacity: 1;
        }

        /* ─── SIGN UP BUTTON ────────────────────────────── */
        .btn-signup {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            background: linear-gradient(135deg, var(--green-light), var(--green-mid));
            border: none;
            border-radius: var(--radius-md);
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--white);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(45,106,79,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(45,106,79,0.5);
            background: linear-gradient(135deg, #5cc491, #33785a);
        }

        /* ─── MESSAGE ───────────────────────────────────── */
        #msg {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        #msg:not(:empty) { display: flex; }

        #msg.success {
            background: rgba(82,183,136,0.15);
            border: 1px solid rgba(82,183,136,0.3);
            color: #7be4b5;
        }

        #msg.error {
            background: rgba(231,76,60,0.12);
            border: 1px solid rgba(231,76,60,0.25);
            color: #f1948a;
        }

        #msg.warn {
            background: rgba(241,196,15,0.1);
            border: 1px solid rgba(241,196,15,0.22);
            color: var(--gold-light);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* ─── DIVIDER ───────────────────────────────────── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 22px 0 18px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.08);
        }

        .divider span {
            font-size: 12px;
            color: rgba(255,255,255,0.25);
        }

        /* ─── BOTTOM LINK ───────────────────────────────── */
        .bottom-link {
            text-align: center;
            font-size: 14px;
            color: rgba(255,255,255,0.4);
        }

        .bottom-link a {
            color: var(--green-light);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .bottom-link a:hover { color: #7be4b5; }

        /* ─── TRUST ROW ─────────────────────────────────── */
        .trust-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.07);
            flex-wrap: wrap;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255,255,255,0.28);
        }

        .trust-item i { color: var(--green-light); font-size: 11px; }

        /* ─── RESPONSIVE ────────────────────────────────── */
        @media (max-width: 520px) {
            .signup-card { padding: 34px 22px 30px; border-radius: 20px; }
            .welcome-title { font-size: 22px; }
        }
    </style>
</head>

<body>

<div class="bg-layer"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="signup-card">

    <!-- Logo -->
    <div class="logo-wrap">
        <div class="logo-icon"><i class="fa-solid fa-seedling"></i></div>
        <div>
            <div class="logo-name">Agri<span>Market</span></div>
            <div class="logo-tagline">Farm Fresh Marketplace</div>
        </div>
    </div>

    <!-- Heading -->
    <div class="welcome-title">Create an account 🌱</div>
    <div class="welcome-sub">Join AgriMarket as a buyer or farmer and start trading fresh produce today.</div>

    <!-- Role Toggle -->
    <div class="role-label-text">I want to join as</div>
    <div class="role-toggle">
        <button class="role-btn" id="btnBuyer" onclick="setRole('buyer')">
            <i class="fa-solid fa-basket-shopping"></i> Buyer
        </button>
        <button class="role-btn" id="btnFarmer" onclick="setRole('farmer')">
            <i class="fa-solid fa-tractor"></i> Farmer
        </button>
    </div>

    <!-- Hidden native select — preserved for JS -->
    <select id="role">
        <option value="">-- Select Role --</option>
        <option value="buyer">buyer</option>
        <option value="farmer">farmer</option>
    </select>

    <!-- Form Fields -->
    <div class="form-grid">

        <div class="form-group">
            <label>Full Name</label>
            <div class="input-wrap">
                <i class="input-icon fa-solid fa-user"></i>
                <input type="text" id="name" placeholder="Enter your full name">
            </div>
        </div>

        <div class="form-group">
            <label>Username</label>
            <div class="input-wrap">
                <i class="input-icon fa-solid fa-at"></i>
                <input type="text" id="username" placeholder="Choose a username">
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
                <i class="input-icon fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Create a password">
            </div>
        </div>

        <!-- Farmer-only: Location (animated reveal) -->
        <div class="form-group location-group" id="locationGroup">
            <label>Farm Location</label>
            <div class="input-wrap">
                <i class="input-icon fa-solid fa-location-dot"></i>
                <input type="text" id="location" placeholder="e.g. Coimbatore, Tamil Nadu">
            </div>
        </div>

    </div>

    <!-- Submit -->
    <button class="btn-signup" onclick="signup()" style="margin-top: 24px;">
        <i class="fa-solid fa-user-plus"></i> Create Account
    </button>

    <!-- Message -->
    <div id="msg" class="message"></div>

    <!-- Divider + Login Link -->
    <div class="divider"><span>already have an account?</span></div>
    <div class="bottom-link">
        <a href="login.html"><i class="fa-solid fa-arrow-right-to-bracket"></i> Sign in to AgriMarket</a>
    </div>

    <!-- Trust -->
    <div class="trust-row">
        <div class="trust-item"><i class="fa-solid fa-shield-halved"></i> Secure Signup</div>
        <div class="trust-item"><i class="fa-solid fa-check-circle"></i> Free to Join</div>
        <div class="trust-item"><i class="fa-solid fa-leaf"></i> 100% Farm Fresh</div>
    </div>

</div>


<script>

    /* ─── ROLE TOGGLE ───────────────────────────────────── */
    function setRole(role) {
        document.getElementById("role").value = role;

        document.getElementById("btnBuyer").classList.toggle("active",  role === "buyer");
        document.getElementById("btnFarmer").classList.toggle("active", role === "farmer");

        // Animated reveal of location field for farmers
        const locGroup = document.getElementById("locationGroup");
        if (role === "farmer") {
            locGroup.classList.add("visible");
        } else {
            locGroup.classList.remove("visible");
        }
    }

    // Also wire the hidden native select for JS compatibility
    document.getElementById("role").addEventListener("change", function () {
        setRole(this.value);
    });

    /* ─── SIGNUP ────────────────────────────────────────── */
    function signup() {
        let role     = document.getElementById("role").value;
        let name     = document.getElementById("name").value;
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;
        let location = document.getElementById("location").value;
        let msgBox   = document.getElementById("msg");

        if (!role || !name || !username || !password) {
            msgBox.className = "message warn";
            msgBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Please fill all required fields`;
            return;
        }

        let url  = "";
        let body = {};

        if (role === "buyer") {
            url  = "http://localhost:8080/buyer";
            body = { name, username, password, wallet: 0 };

        } else if (role === "farmer") {
            if (!location) {
                msgBox.className = "message warn";
                msgBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Location is required for farmers`;
                return;
            }
            url  = "http://localhost:8080/farmer";
            body = { name, username, password, wallet: 0, location };
        }

        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        })
        .then(res => res.text())
        .then(msg => {
            if (msg.toLowerCase().includes("success")) {
                msgBox.className = "message success";
                msgBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg} — Redirecting to login…`;

                // Clear form
                document.getElementById("name").value     = "";
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
                document.getElementById("location").value = "";
                document.getElementById("role").value     = "";
                document.getElementById("locationGroup").classList.remove("visible");
                document.getElementById("btnBuyer").classList.remove("active");
                document.getElementById("btnFarmer").classList.remove("active");

                setTimeout(() => window.location.href = "login.html", 1400);

            } else {
                msgBox.className = "message error";
                msgBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${msg}`;
            }
        })
        .catch(err => {
            console.error(err);
            msgBox.className = "message error";
            msgBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Signup failed. Please try again.`;
        });
    }

</script>

</body>
</html>
