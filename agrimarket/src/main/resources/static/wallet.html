<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AgriMarket — Recharge Wallet</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        :root {
            --cream:       #faf7f2;
            --beige:       #f0ebe0;
            --green-dark:  #1a3d2b;
            --green-mid:   #2d6a4f;
            --green-light: #52b788;
            --gold:        #c9a84c;
            --gold-light:  #f0d080;
            --text-main:   #1c2b22;
            --text-muted:  #6b7f6e;
            --white:       #ffffff;
            --radius-lg:   20px;
            --radius-md:   12px;
            --radius-sm:   8px;
            --transition:  all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--green-dark);
            overflow-x: hidden;
            padding: 32px 20px;
        }

        /* ─── BACKGROUND ────────────────────────────────── */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 60% at 20% 15%,  rgba(82,183,136,0.16) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 85%,  rgba(201,168,76,0.13) 0%, transparent 60%),
                linear-gradient(160deg, #0d2017 0%, #1a3d2b 50%, #0f2419 100%);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: drift linear infinite;
            opacity: 0.06;
        }

        .orb1 { width: 300px; height: 300px; background: var(--green-light); top: -70px;  left: -60px;  animation-duration: 19s; }
        .orb2 { width: 200px; height: 200px; background: var(--gold);        bottom: -50px; right: -40px; animation-duration: 23s; animation-delay: -9s; }
        .orb3 { width: 130px; height: 130px; background: var(--green-light); bottom: 25%; left: 8%;    animation-duration: 16s; animation-delay: -4s; }

        @keyframes drift {
            0%   { transform: translate(0,0) scale(1); }
            33%  { transform: translate(20px, -15px) scale(1.04); }
            66%  { transform: translate(-15px, 12px) scale(0.97); }
            100% { transform: translate(0,0) scale(1); }
        }

        /* ─── CARD ──────────────────────────────────────── */
        .recharge-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 44px 44px 40px;
            box-shadow:
                0 32px 80px rgba(0,0,0,0.4),
                0 0 0 1px rgba(82,183,136,0.08) inset;
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ─── LOGO ──────────────────────────────────────── */
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, var(--green-light), var(--gold));
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--white);
            box-shadow: 0 4px 18px rgba(82,183,136,0.4);
            flex-shrink: 0;
        }

        .logo-name {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--white);
            line-height: 1;
        }

        .logo-name span { color: var(--gold-light); }

        .logo-tagline {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* ─── CURRENT BALANCE DISPLAY ───────────────────── */
        .balance-box {
            background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.06));
            border: 1px solid rgba(201,168,76,0.25);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 30px;
            animation: cardIn 0.7s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .balance-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--gold), #a0782a);
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--white);
            box-shadow: 0 4px 14px rgba(201,168,76,0.35);
            flex-shrink: 0;
        }

        .balance-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.4);
            margin-bottom: 4px;
        }

        .balance-amount {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--gold-light);
            line-height: 1;
        }

        /* ─── SECTION TITLE ─────────────────────────────── */
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 6px;
        }

        .section-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* ─── QUICK AMOUNTS ─────────────────────────────── */
        .quick-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 10px;
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-btn {
            padding: 10px 6px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            color: rgba(255,255,255,0.6);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .quick-btn:hover, .quick-btn.selected {
            background: rgba(82,183,136,0.15);
            border-color: var(--green-light);
            color: var(--white);
            box-shadow: 0 0 0 2px rgba(82,183,136,0.2);
        }

        /* ─── CUSTOM AMOUNT INPUT ───────────────────────── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 22px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.38);
        }

        .input-wrap {
            position: relative;
        }

        .input-prefix {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            font-weight: 600;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
            font-family: 'DM Sans', sans-serif;
            transition: color 0.2s;
        }

        .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 40px;
            background: rgba(255,255,255,0.07);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            font-family: 'DM Sans', sans-serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--white);
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .input-wrap input::placeholder { color: rgba(255,255,255,0.2); font-size: 18px; font-weight: 400; }

        .input-wrap input:focus {
            border-color: var(--green-light);
            background: rgba(82,183,136,0.08);
            box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
        }

        .input-wrap:focus-within .input-prefix { color: var(--green-light); }

        /* ─── RECHARGE BUTTON ───────────────────────────── */
        .btn-recharge {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--gold) 0%, #a0782a 100%);
            border: none;
            border-radius: var(--radius-md);
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--white);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(201,168,76,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.3px;
            margin-bottom: 6px;
        }

        .btn-recharge:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(201,168,76,0.55);
            background: linear-gradient(135deg, #d4b05a, var(--gold));
        }

        .btn-recharge:active { transform: translateY(0); }

        /* ─── BACK BUTTON ───────────────────────────────── */
        .btn-back {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.09);
            color: rgba(255,255,255,0.8);
            border-color: rgba(255,255,255,0.2);
        }

        /* ─── MESSAGE ───────────────────────────────────── */
        #msg {
            margin-bottom: 16px;
            padding: 13px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        #msg:not(:empty) { display: flex; }

        #msg.success {
            background: rgba(82,183,136,0.15);
            border: 1px solid rgba(82,183,136,0.3);
            color: #7be4b5;
        }

        #msg.error {
            background: rgba(231,76,60,0.12);
            border: 1px solid rgba(231,76,60,0.25);
            color: #f1948a;
        }

        #msg.warn {
            background: rgba(241,196,15,0.1);
            border: 1px solid rgba(241,196,15,0.22);
            color: var(--gold-light);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* ─── TRUST ROW ─────────────────────────────────── */
        .trust-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.07);
            flex-wrap: wrap;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255,255,255,0.28);
        }

        .trust-item i { color: var(--gold); font-size: 11px; }

        /* ─── RESPONSIVE ────────────────────────────────── */
        @media (max-width: 520px) {
            .recharge-card { padding: 34px 22px 30px; border-radius: 20px; }
            .quick-amounts { grid-template-columns: repeat(4, 1fr); gap: 6px; }
        }
    </style>
</head>

<body>

<div class="bg-layer"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="recharge-card">

    <!-- Logo -->
    <div class="logo-wrap">
        <div class="logo-icon"><i class="fa-solid fa-seedling"></i></div>
        <div>
            <div class="logo-name">Agri<span>Market</span></div>
            <div class="logo-tagline">Wallet Recharge</div>
        </div>
    </div>

    <!-- Current Balance -->
    <div class="balance-box">
        <div class="balance-icon"><i class="fa-solid fa-wallet"></i></div>
        <div>
            <div class="balance-label">Current Balance</div>
            <div class="balance-amount" id="currentBalance">Rs. —</div>
        </div>
    </div>

    <!-- Title -->
    <div class="section-title">Add Money 💰</div>
    <div class="section-sub">Choose a quick amount or enter a custom value to top up your wallet instantly.</div>

    <!-- Quick Amounts -->
    <div class="quick-label">Quick Add</div>
    <div class="quick-amounts">
        <button class="quick-btn" onclick="selectQuick(100)">₹100</button>
        <button class="quick-btn" onclick="selectQuick(250)">₹250</button>
        <button class="quick-btn" onclick="selectQuick(500)">₹500</button>
        <button class="quick-btn" onclick="selectQuick(1000)">₹1000</button>
    </div>

    <!-- Custom Amount -->
    <div class="form-group">
        <label>Custom Amount</label>
        <div class="input-wrap">
            <span class="input-prefix">₹</span>
            <input type="number" id="amount" placeholder="0" min="1" oninput="clearQuickSelect()"/>
        </div>
    </div>

    <!-- Message -->
    <div id="msg" class="message"></div>

    <!-- Recharge Button -->
    <button class="btn-recharge" onclick="recharge()">
        <i class="fa-solid fa-bolt"></i> Recharge Now
    </button>

    <!-- Back Button -->
    <button class="btn-back" onclick="goBack()">
        <i class="fa-solid fa-arrow-left"></i> Back to Marketplace
    </button>

    <!-- Trust -->
    <div class="trust-row">
        <div class="trust-item"><i class="fa-solid fa-shield-halved"></i> Secure Payment</div>
        <div class="trust-item"><i class="fa-solid fa-bolt"></i> Instant Credit</div>
        <div class="trust-item"><i class="fa-solid fa-rotate-left"></i> Easy Refill</div>
    </div>

</div>


<script>

    /* ─── LOAD CURRENT BALANCE ──────────────────────────── */
    function loadBalance() {
        let buyerId = localStorage.getItem("buyerId");

        if (!buyerId) {
            window.location.href = "login.html";
            return;
        }

        fetch(`http://localhost:8080/buyer/${buyerId}`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("currentBalance").innerText = `Rs. ${data.wallet}`;
        })
        .catch(err => {
            console.error(err);
            document.getElementById("currentBalance").innerText = "Rs. —";
        });
    }

    /* ─── QUICK SELECT ──────────────────────────────────── */
    function selectQuick(amount) {
        document.getElementById("amount").value = amount;

        // Highlight selected button
        document.querySelectorAll(".quick-btn").forEach(btn => btn.classList.remove("selected"));
        event.target.classList.add("selected");
    }

    function clearQuickSelect() {
        document.querySelectorAll(".quick-btn").forEach(btn => btn.classList.remove("selected"));
    }

    /* ─── RECHARGE ──────────────────────────────────────── */
    function recharge() {
        let buyerId = localStorage.getItem("buyerId");
        let amount  = document.getElementById("amount").value;
        let msgBox  = document.getElementById("msg");

        if (!buyerId) {
            window.location.href = "login.html";
            return;
        }

        if (!amount || isNaN(amount) || amount <= 0) {
            msgBox.className = "message warn";
            msgBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Please enter a valid amount`;
            return;
        }

        fetch(`http://localhost:8080/buyer/recharge/${buyerId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ amount: parseInt(amount) })
        })
        .then(res => res.text())
        .then(msg => {
            if (msg.toLowerCase().includes("success") || msg.toLowerCase().includes("recharge")) {
                msgBox.className = "message success";
                msgBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> Rs. ${amount} added successfully!`;

                // Clear input + selection
                document.getElementById("amount").value = "";
                document.querySelectorAll(".quick-btn").forEach(b => b.classList.remove("selected"));

                // Refresh balance display
                loadBalance();
            } else {
                msgBox.className = "message error";
                msgBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${msg}`;
            }
        })
        .catch(err => {
            console.error(err);
            msgBox.className = "message error";
            msgBox.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Recharge failed. Please try again.`;
        });
    }

    /* ─── BACK ──────────────────────────────────────────── */
    function goBack() {
        window.location.href = "index.html";
    }

    /* ─── ENTER KEY ─────────────────────────────────────── */
    document.addEventListener("keydown", e => {
        if (e.key === "Enter") recharge();
    });

    /* ─── INIT ──────────────────────────────────────────── */
    loadBalance();

</script>

</body>
</html>
