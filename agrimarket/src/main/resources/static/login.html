<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>AgriMarket — Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        :root {
            --cream:       #faf7f2;
            --beige:       #f0ebe0;
            --green-dark:  #1a3d2b;
            --green-mid:   #2d6a4f;
            --green-light: #52b788;
            --gold:        #c9a84c;
            --gold-light:  #f0d080;
            --text-main:   #1c2b22;
            --text-muted:  #6b7f6e;
            --white:       #ffffff;
            --radius-lg:   20px;
            --radius-md:   12px;
            --radius-sm:   8px;
            --transition:  all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--green-dark);
            overflow: hidden;
            position: relative;
        }

        /* ─── ANIMATED BG ───────────────────────────────── */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 60% at 15% 10%,  rgba(82,183,136,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 85% 85%,  rgba(201,168,76,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 50% 50%,  rgba(26,61,43,0.6)   0%, transparent 80%),
                linear-gradient(160deg, #0f2419 0%, #1a3d2b 50%, #0d2017 100%);
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: drift linear infinite;
            opacity: 0.06;
        }

        .orb1 { width: 340px; height: 340px; background: var(--green-light); top: -100px; left: -80px; animation-duration: 18s; }
        .orb2 { width: 220px; height: 220px; background: var(--gold);        bottom: -60px; right: -50px; animation-duration: 22s; animation-delay: -8s; }
        .orb3 { width: 160px; height: 160px; background: var(--green-light); bottom: 20%;  left: 10%;   animation-duration: 15s; animation-delay: -4s; }

        @keyframes drift {
            0%   { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(30px, -20px) scale(1.05); }
            66%  { transform: translate(-20px, 15px) scale(0.97); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* ─── SPLIT LAYOUT ──────────────────────────────── */
        .page-wrap {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 100%;
            min-height: 100vh;
            padding: 32px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 48px 44px 44px;
            box-shadow:
                0 32px 80px rgba(0,0,0,0.4),
                0 0 0 1px rgba(82,183,136,0.08) inset;
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ─── LOGO ──────────────────────────────────────── */
        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, var(--green-light), var(--gold));
            border-radius: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--white);
            box-shadow: 0 4px 18px rgba(82,183,136,0.4);
            flex-shrink: 0;
        }

        .logo-text-wrap .logo-name {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            color: var(--white);
            line-height: 1;
        }

        .logo-text-wrap .logo-name span { color: var(--gold-light); }

        .logo-text-wrap .logo-tagline {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1.8px;
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* ─── WELCOME TEXT ──────────────────────────────── */
        .welcome-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--white);
            line-height: 1.25;
            margin-bottom: 8px;
        }

        .welcome-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 36px;
            line-height: 1.5;
        }

        /* ─── ROLE TOGGLE ───────────────────────────────── */
        .role-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            margin-bottom: 10px;
        }

        .role-toggle {
            display: flex;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 4px;
            margin-bottom: 28px;
            gap: 4px;
        }

        /* Hidden native select — kept for JS compatibility */
        #role {
            display: none;
        }

        .role-btn {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 50px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            color: rgba(255,255,255,0.5);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .role-btn.active {
            background: linear-gradient(135deg, var(--green-light), var(--green-mid));
            color: var(--white);
            box-shadow: 0 4px 14px rgba(45,106,79,0.4);
            font-weight: 600;
        }

        .role-btn:not(.active):hover {
            color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.06);
        }

        /* ─── FORM FIELDS ───────────────────────────────── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-wrap input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            background: rgba(255,255,255,0.07);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--white);
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .input-wrap input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .input-wrap input:focus {
            border-color: var(--green-light);
            background: rgba(82,183,136,0.08);
            box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
        }

        .input-wrap input:focus + .input-icon,
        .input-wrap:focus-within .input-icon {
            color: var(--green-light);
        }

        /* ─── LOGIN BUTTON ──────────────────────────────── */
        .btn-login {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, var(--green-light) 0%, var(--green-mid) 100%);
            border: none;
            border-radius: var(--radius-md);
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: var(--white);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(45,106,79,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(45,106,79,0.5);
            background: linear-gradient(135deg, #5cc491, #33785a);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* ─── MESSAGE ───────────────────────────────────── */
        #msg {
            margin-top: 18px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        #msg:not(:empty) { display: flex; }

        #msg.success {
            background: rgba(82,183,136,0.15);
            border: 1px solid rgba(82,183,136,0.3);
            color: #7be4b5;
        }

        #msg.error {
            background: rgba(231,76,60,0.12);
            border: 1px solid rgba(231,76,60,0.25);
            color: #f1948a;
        }

        #msg.warn {
            background: rgba(241,196,15,0.12);
            border: 1px solid rgba(241,196,15,0.25);
            color: var(--gold-light);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* ─── FOOTER TEXT ───────────────────────────────── */
        .card-footer-text {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: rgba(255,255,255,0.25);
            line-height: 1.6;
        }

        .card-footer-text span { color: var(--green-light); }

        /* ─── TRUST BADGES ──────────────────────────────── */
        .trust-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid rgba(255,255,255,0.07);
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
        }

        .trust-item i { color: var(--green-light); font-size: 11px; }

        /* ─── RESPONSIVE ────────────────────────────────── */
        @media (max-width: 520px) {
            .login-card { padding: 36px 24px 32px; border-radius: 20px; }
            .welcome-title { font-size: 24px; }
        }
    </style>
</head>

<body>

<div class="bg-layer"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="page-wrap">
    <div class="login-card">

        <!-- Logo -->
        <div class="logo-wrap">
            <div class="logo-icon"><i class="fa-solid fa-seedling"></i></div>
            <div class="logo-text-wrap">
                <div class="logo-name">Agri<span>Market</span></div>
                <div class="logo-tagline">Farm Fresh Marketplace</div>
            </div>
        </div>

        <!-- Welcome -->
        <div class="welcome-title">Welcome back 👋</div>
        <div class="welcome-sub">Sign in to your account to continue buying or selling fresh produce.</div>

        <!-- Role Toggle -->
        <div class="role-label">I am a</div>
        <div class="role-toggle">
            <button class="role-btn active" id="btnBuyer" onclick="setRole('buyer')">
                <i class="fa-solid fa-basket-shopping"></i> Buyer
            </button>
            <button class="role-btn" id="btnFarmer" onclick="setRole('farmer')">
                <i class="fa-solid fa-tractor"></i> Farmer
            </button>
        </div>

        <!-- Hidden native select kept for JS -->
        <select id="role">
            <option value="buyer" selected>buyer</option>
            <option value="farmer">farmer</option>
        </select>

        <!-- Username -->
        <div class="form-group">
            <label>Username</label>
            <div class="input-wrap">
                <i class="input-icon fa-solid fa-user"></i>
                <input type="text" id="username" placeholder="Enter your username">
            </div>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label>Password</label>
            <div class="input-wrap">
                <i class="input-icon fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Enter your password">
            </div>
        </div>

        <!-- Login Button -->
        <button class="btn-login" onclick="login()">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
        </button>

        <!-- Message -->
        <div id="msg" class="message"></div>

        <!-- Trust -->
        <div class="trust-row">
            <div class="trust-item"><i class="fa-solid fa-shield-halved"></i> Secure Login</div>
            <div class="trust-item"><i class="fa-solid fa-check-circle"></i> Verified Platform</div>
            <div class="trust-item"><i class="fa-solid fa-leaf"></i> 100% Farm Fresh</div>
        </div>

        <div class="card-footer-text">
            © 2025 <span>AgriMarket</span> · Connecting Farmers & Buyers Across India
        </div>

    </div>
</div>


<script>

    /* ─── ROLE TOGGLE UI ────────────────────────────────── */
    function setRole(role) {
        document.getElementById("role").value = role;

        document.getElementById("btnBuyer").classList.toggle("active",  role === "buyer");
        document.getElementById("btnFarmer").classList.toggle("active", role === "farmer");
    }

    /* ─── LOGIN ─────────────────────────────────────────── */
    function login() {
        let role     = document.getElementById("role").value;
        let username = document.getElementById("username").value;
        let password = document.getElementById("password").value;
        let msg      = document.getElementById("msg");

        if (!role || !username || !password) {
            msg.className = "message warn";
            msg.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> All fields are required`;
            return;
        }

        fetch(`http://localhost:8080/${role}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(res => res.json())
        .then(data => {
            console.log("LOGIN RESPONSE:", data);

            if (data && data.id) {
                msg.className = "message success";
                msg.innerHTML = `<i class="fa-solid fa-circle-check"></i> Login successful! Redirecting…`;

                if (role === "buyer") {
                    localStorage.setItem("buyerId", data.id);
                    setTimeout(() => window.location.href = "index.html", 800);
                } else if (role === "farmer") {
                    localStorage.setItem("farmerId", data.id);
                    setTimeout(() => window.location.href = "farmer.html", 800);
                }

            } else {
                msg.className = "message error";
                msg.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Invalid username or password`;
            }
        })
        .catch(err => {
            console.error(err);
            msg.className = "message error";
            msg.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Login failed. Please try again.`;
        });
    }

    /* Allow Enter key to submit */
    document.addEventListener("keydown", e => {
        if (e.key === "Enter") login();
    });

</script>

</body>
</html>
